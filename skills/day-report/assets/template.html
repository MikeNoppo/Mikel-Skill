<title>{{TITLE}}</title>

<style>
  :root {
    color-scheme: light;
    --bg:#fff; --card:#fff; --ink:#20242c; --muted:#68717e; --line:#e5e7eb;

  header p { max-width:720px; color:var(--muted); }
  .verdict { display:flex; align-items:baseline; gap:12px 16px; flex-wrap:wrap; margin-top:25px; font-size:13px; color:var(--muted); }
  .status { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; border:1px solid currentColor; padding:3px 9px; border-radius:4px; white-space:nowrap; }
  .status::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }
  .pills { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; margin-top:18px; }
  .pill { color:var(--muted); font-size:12px; }

  nav::before { content:"DAY REPORT"; display:block; padding:0 14px 30px; color:var(--ink); font:600 11px/1.5 ui-monospace,monospace; letter-spacing:.13em; }
  nav .wrap { display:flex; flex-direction:column; gap:3px; counter-reset:nav; }

  nav a:hover,nav a[aria-current="location"] { background:#edf0f4; color:#20242c; }

  section { padding:34px 0 38px; border-bottom:1px solid var(--line); scroll-margin-top:16px; min-width:0; }

  h3 { margin:28px 0 12px; font-size:15px; font-weight:650; letter-spacing:-.01em; }

  .g3 { grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }

    main { margin:0; padding:0 24px; } section { padding:28px 0; } .eyebrow { font-size:10px; margin-bottom:16px; }
    .g4 { grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px 0; } .stat:nth-child(odd) { border-left:0; padding-left:0; }
    .g2,.g3 { grid-template-columns:1fr; } .pair { grid-template-columns:1fr; }
    details.file > summary { grid-template-columns:48px minmax(0,1fr) 65px; gap:8px; } details.file > summary > :last-child { grid-column:2 / -1; }
    th,td { padding:9px 6px; font-size:12px; } dl.step { grid-template-columns:1fr; gap:3px; } dl.step dd { margin-bottom:9px; }

  @media(prefers-reduced-motion:reduce) { html { overflow-wrap:anywhere; scroll-behavior:auto; } }

<div class="theme-switch" role="group" aria-label="Tema laporan">
  <button type="button" data-theme-choice="white" aria-pressed="true">Terang</button>
  <button type="button" data-theme-choice="black" aria-pressed="false">Gelap</button>
</div>

<dialog id="zoom"><img alt=""></dialog>
<script>
  const themeButtons = [...document.querySelectorAll('[data-theme-choice]')];
  const syncThemeButtons = () => themeButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.themeChoice === document.documentElement.dataset.theme)));
  syncThemeButtons();
  themeButtons.forEach((button) => button.addEventListener('click', () => {
    const theme = button.dataset.themeChoice;
    if (document.documentElement.dataset.theme === theme) return;
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('day-report-theme', theme); } catch {}
    syncThemeButtons();
    window.dispatchEvent(new Event('report-theme-change'));
  }));
  let closedBeforePrint = [];
  window.addEventListener('beforeprint', () => {
    closedBeforePrint = [...document.querySelectorAll('details.file:not([open])')];
    closedBeforePrint.forEach((item) => { item.open = true; });
  });
  window.addEventListener('afterprint', () => {
    closedBeforePrint.forEach((item) => { item.open = false; });
    closedBeforePrint = [];
  });
  const zoom = document.getElementById('zoom');
  document.querySelectorAll('figure img').forEach((img) => img.addEventListener('click', () => {
    zoom.querySelector('img').src = img.src;
    zoom.showModal();
  }));
  zoom.addEventListener('click', () => zoom.close());
  document.querySelectorAll('button.copy').forEach((button) => button.addEventListener('click', async () => {
    const source = button.nextElementSibling;
    try {
      await navigator.clipboard.writeText(source.textContent);
      button.textContent = 'Tersalin';
    } catch {
      const range = document.createRange();
      range.selectNodeContents(source);
      getSelection().removeAllRanges();
      getSelection().addRange(range);
      button.textContent = 'Ctrl+C';
    }
    setTimeout(() => { button.textContent = 'Salin'; }, 1500);
  }));
  const links = [...document.querySelectorAll('nav a')];
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
